<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtomCode Harness</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f4145'/%3E%3Cpath d='M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索会话..." autocomplete="off" />
      </div>

      <div class="sidebar-scroll">
        <section class="group" id="groupNormal">
          <button class="group-head" data-group="normal">
            <svg class="chev-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            <span>普通会话</span><span class="group-count" id="countNormal">(0)</span>
          </button>
          <div class="group-body" id="listNormal"></div>
        </section>
        <section class="group" id="groupWorkspace">
          <button class="group-head" data-group="workspace">
            <svg class="chev-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            <span>工作区</span><span class="group-count" id="countWorkspace">(0)</span>
          </button>
          <div class="group-body" id="listWorkspace"></div>
        </section>
      </div>

      <div class="sidebar-foot">
        <span class="status-dot" id="sideStatusDot"></span>
        <span id="sideStatusText">正在连接 CLI...</span>
        <button class="icon-btn tiny" id="sideSettingsBtn" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3v-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
        </button>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <main class="main">
      <header class="topbar">
        <div class="conv-head">
          <div class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M16 5.5l2.6 8 8 2.6-8 2.6-2.6 8-2.6-8-8-2.6 8-2.6z" fill="currentColor"/><circle cx="24.5" cy="7.5" r="2" fill="currentColor"/><circle cx="7.5" cy="24.5" r="1.6" fill="currentColor"/></svg>
          </div>
          <div class="conv-meta">
            <div class="conv-title" id="convTitle">新对话</div>
            <div class="conv-sub" id="convSub">AtomCode Agent · 普通会话</div>
          </div>
        </div>
        <div class="top-actions">
          <span class="cli-badge" id="cliBadge"><i></i><span id="cliBadgeText">CLI 检测中</span></span>
          <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="top-btn" id="newChatTop">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            新对话
          </button>
        </div>
      </header>

      <section class="thread" id="thread">
        <div class="empty-state" id="emptyState">
          <h2>今天要 <span>AtomCode</span> 处理什么?</h2>
          <p class="empty-sub" id="emptySub">连接本地 AtomCode CLI，所有工具与文件操作都在你的工作目录中执行</p>
        </div>
        <div class="messages" id="messages"></div>

        <div class="composer-wrap" id="composerWrap">
          <div class="composer" id="composer">
            <div class="attach-chips" id="attachChips" hidden></div>
            <textarea id="input" rows="2" placeholder="输入消息...（/ 唤起技能，@ 引用文件）" spellcheck="false"></textarea>
            <div class="composer-toolbar">
              <div class="tools-left">
                <button class="tool-btn" id="cwdBtn" title="选择工作目录">
                  <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M8 6V4h8v2"/></svg>
                  <span id="cwdLabel">选择仓库</span>
                </button>
                <span class="branch-chip" id="branchChip" hidden title="当前分支">
                  <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-5 3-9 4.5"/></svg>
                  <span id="branchLabel"></span>
                </span>
                <button class="icon-btn tool plus" id="plusBtn" title="更多选项" aria-label="更多选项">
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
              </div>
              <div class="tools-right">
                <button class="model-btn" id="modelBtn" title="选择模型"><span id="modelLabel">默认模型</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
                <button class="icon-btn tool" id="resetBtn" title="重置上下文 / 查看运行信息" aria-label="运行信息">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </button>
                <button class="send-btn" id="sendBtn" title="发送 (Enter)" aria-label="发送">
                  <svg class="icon-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg>
                  <svg class="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="usage-bar" id="usageBar">
            <button class="usage-refresh" id="usageRefresh" title="刷新额度与上下文占用" aria-label="刷新额度">
              <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.6M20 5v6h-6"/></svg>
            </button>
            <div class="usage-item wide" id="usageWindow">
              <span class="u-label">5h 窗口</span>
              <span class="u-value" id="usageWindowValue">--</span>
              <span class="u-track"><i id="usageWindowBar"></i></span>
            </div>
            <div class="usage-item" id="usageReset">
              <span class="u-label">重置</span>
              <span class="u-value" id="usageResetValue">--</span>
            </div>
            <div class="usage-item" id="usagePlan">
              <span class="u-label">CodingPlan</span>
              <span class="u-value" id="usagePlanValue">--</span>
            </div>
            <div class="usage-item wide" id="usageContext">
              <span class="u-label">上下文</span>
              <span class="u-value" id="usageContextValue">--</span>
              <span class="u-track"><i id="usageContextBar"></i></span>
            </div>
            <span class="usage-state" id="usageState"></span>
            <span class="run-timer" id="runTimer"></span>
          </div>
        </div>
        <div class="empty-spacer" id="emptySpacer"></div>
      </section>

      <!-- floating popovers -->
      <div class="popover" id="popover" hidden></div>
      <div class="autocomplete" id="autocomplete" hidden></div>
      <input type="file" id="fileInput" multiple hidden />
    </main>
  </div>

  <!-- ============ Settings / directory modal ============ -->
  <div class="modal-mask" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle">设置</h3><button class="icon-btn" id="modalClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
